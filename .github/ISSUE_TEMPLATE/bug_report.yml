name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际结果和预期结果，不要粘贴 API Key。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 出现…"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Linkcho 版本
      placeholder: "1.0.0"
    validations:
      required: true

